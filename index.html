<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Green Lady Cider</title>
<link rel="icon" href="img/apple.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Green Lady cider - barrel and bottle pages.
  Data lives in the owner's Google Sheet, served by a Google Apps Script web app (see apps-script/Code.gs).
  Links:
    #barrels  #blends  #bottles   the three tabs   (#barrels/new, #blends/new, #B07/edit, #B07/fill, #blend/26A/edit = edit forms)
    #B07            barrel page (NFC tag / QR on the barrel)
    #26A-B07-031    bottle page + rating (QR label on the bottle; the -031 bottle number is optional)
    #league         league table of bottling runs
    #labels/26A-B07/23   printable bottle QR labels     #labels/barrels   barrel QR stickers
  All Sheet text is shown with textContent only.
-->
<style>
:root {
  --bg: #f4efe2; --card: #fffdf7; --ink: #1d2a20; --muted: #5f6b5f; --line: #e2dccb;
  --green: #2f5d3a; --green-deep: #1c3a25; --apple: #7fae3a; --gold: #b8913c; --pill: #e6f0d6;
  --good: #3f8a3a; --ok: #c99a2e; --poor: #b5483a; --input: #ffffff;
  --tag-bg: #fbe3b4; --tag-ink: #7a4510; --tag-line: #ecc98a; --btn: #2f5d3a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a14; --card: #1b261e; --ink: #ecf0e6; --muted: #9fae9f; --line: #2c3a2f;
    --green: #8fc56a; --green-deep: #0e1d13; --apple: #9ccc55; --gold: #d8b25c; --pill: #26391f;
    --good: #6dbb5f; --ok: #e0b54a; --poor: #e07563; --input: #142017;
    --tag-bg: #4a3818; --tag-ink: #f5d48f; --tag-line: #6b5226; --btn: #3b7347;
  }
}
:root[data-theme="dark"] {
  --bg: #121a14; --card: #1b261e; --ink: #ecf0e6; --muted: #9fae9f; --line: #2c3a2f;
  --green: #8fc56a; --green-deep: #0e1d13; --apple: #9ccc55; --gold: #d8b25c; --pill: #26391f;
  --good: #6dbb5f; --ok: #e0b54a; --poor: #e07563; --input: #142017;
    --tag-bg: #4a3818; --tag-ink: #f5d48f; --tag-line: #6b5226; --btn: #3b7347;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; }
a { color: var(--green); }
header { background: var(--green-deep); color: #f4efe2; text-align: center; padding: 24px 16px 22px; border-bottom: 4px solid var(--gold); }
header a { color: inherit; text-decoration: none; }
header .kicker { font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: #cfdcc3; }
header .mark { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: clamp(38px, 11vw, 60px); line-height: 1; margin: 8px 0 4px; display: flex; align-items: center; justify-content: center; gap: 12px; }
header .mark svg { width: .8em; height: .8em; flex: none; }
header .vintage { font-family: Fraunces, Georgia, serif; font-size: 18px; color: var(--gold); letter-spacing: .1em; min-height: 1.4em; }
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.card h2 { font-family: Fraunces, Georgia, serif; font-size: 20px; margin: 0 0 12px; color: var(--green); font-weight: 600; }
.confirm { margin-top: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.confirm p { margin: 0 0 10px; font-weight: 600; text-align: center; }
button.danger-solid { background: var(--poor); border-color: var(--poor); color: #fff; }
button.danger { color: var(--poor); border-color: color-mix(in srgb, var(--poor) 45%, transparent); background: transparent; }
.cardhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.cardhead h2 { margin: 0; }
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.head h1 { font-family: Fraunces, Georgia, serif; margin: 0; font-size: 28px; line-height: 1.15; }
.sub { color: var(--muted); font-size: 14px; }
.pill { background: var(--pill); color: var(--green); font-weight: 600; font-size: 13px; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
.pill.tag { background: var(--tag-bg); color: var(--tag-ink); border: 1px solid var(--tag-line); }
.pill.empty { background: var(--line); color: var(--muted); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .v { font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.stat .v.small { font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; padding-top: 4px; }
.stat .s { font-size: 13px; color: var(--muted); }
.apples { list-style: none; margin: 0; padding: 0; }
.apples li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.apples li:first-child { border-top: 0; padding-top: 0; }
.apples .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--apple); flex: none; }
.apples .name { font-weight: 600; }
.apples .dot.yeast { background: var(--gold); }
.apples .share { margin-left: auto; font-weight: 600; color: var(--green); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 0 6px 6px 0; }
td { padding: 8px 6px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.notes { margin: 0; white-space: pre-line; }
.list a, .list .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
.list > :first-child { border-top: 0; padding-top: 0; }
.list .name { font-weight: 600; }
.list a:hover .name { color: var(--green); }
.list .right { text-align: right; flex: none; }
.list .row > a { flex: 1; min-width: 0; border-top: 0; padding: 0; }
.list a.brow { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; }
.list a.brow > .pill, .list a.brow > .mid { justify-self: center; }
.list a.brow .mid { display: grid; justify-items: center; gap: 2px; }
.list a.edit { flex: none; padding: 6px 12px; border: 1px solid var(--btn); border-radius: 8px; font-size: 14px; font-weight: 600; background: var(--btn); color: #fff; }
.muted, .empty { color: var(--muted); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button, .button { font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 12px; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
button.primary, .button.primary { background: var(--btn); border-color: var(--btn); color: #fff; }
.button.soft, button.soft { background: var(--pill); border-color: color-mix(in srgb, var(--btn) 35%, transparent); color: var(--green); }
button:disabled { opacity: .5; cursor: default; }
.full { width: 100%; }
button.small, .button.small { padding: 6px 14px; font-size: 14px; flex: none; }
.bhead { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 10px; }
.bhead h1 { font-family: Fraunces, Georgia, serif; margin: 0; font-size: 28px; line-height: 1.15; white-space: nowrap; }
.bhead .pill { justify-self: center; background: var(--tag-bg); color: var(--tag-ink); border: 1px solid var(--tag-line); font-size: 17px; font-weight: 700; padding: 7px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.bhead .button.small { padding: 8px 12px; font-size: 15px; font-weight: 700; line-height: 1.2; max-width: 120px; }
.bhead .sub { grid-column: 1 / -1; margin-top: 2px; }
@media (max-width: 440px) {
  .bhead { column-gap: 8px; }
  .bhead h1 { font-size: 23px; }
  .bhead .pill { font-size: 14px; padding: 5px 11px; }
  .bhead .button.small { max-width: 80px; padding: 6px 8px; font-size: 13px; }
}
form { margin-top: 14px; display: grid; gap: 12px; }
label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
label small { font-weight: 400; color: var(--muted); }
input, select, textarea { font: inherit; font-weight: 400; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--input); color: var(--ink); width: 100%; }
textarea { min-height: 70px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.msg { padding: 10px 12px; border-radius: 8px; font-size: 14px; }
.msg.ok { background: var(--pill); color: var(--green); }
.msg.err { background: color-mix(in srgb, var(--poor) 15%, transparent); color: var(--poor); }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rate button { padding: 14px 6px; font-size: 15px; display: grid; gap: 4px; justify-items: center; }
.rate button .e { font-size: 30px; line-height: 1; }
.rate button.on { border-width: 2px; }
.rate button.on.Good { border-color: var(--good); color: var(--good); }
.rate button.on.OK { border-color: var(--ok); color: var(--ok); }
.rate button.on.Poor { border-color: var(--poor); color: var(--poor); }
.more { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.more summary { cursor: pointer; color: var(--green); font-weight: 600; font-size: 14px; }
.more[open] summary { margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { padding: 6px 12px; font-size: 14px; font-weight: 500; border-radius: 999px; }
.chips button.on { background: var(--pill); border-color: var(--green); color: var(--green); }
.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 8px 0 4px; }
.bar span { display: block; }
.score { font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; }
.rank { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 20px; color: var(--gold); width: 28px; flex: none; }
.codebox { display: flex; gap: 8px; }
.codebox input { text-transform: uppercase; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 32px; }
footer a { color: inherit; }
.tabs { position: sticky; top: 0; z-index: 5; display: flex; justify-content: center; background: var(--card); border-bottom: 1px solid var(--line); }
.tabs a { flex: 1; max-width: 214px; text-align: center; padding: 14px 6px 11px; font-weight: 600; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; }
.tabs a.on { color: var(--green); border-bottom-color: var(--green); }
.msg.gap { margin-bottom: 16px; }
.applerows { display: grid; gap: 10px; }
.applerow { display: grid; grid-template-columns: 1fr 72px 44px; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.applerow .loc { grid-column: 1 / -1; }
.applerow button { padding: 0; font-size: 20px; font-weight: 400; color: var(--muted); }
.total { font-size: 14px; color: var(--muted); }
.total.bad { color: var(--poor); }
.formcard h3:first-child { margin-top: 0; }
/* Labels */
.sheet { background: #fff; color: #000; width: 210mm; padding: 15.1mm 7.2mm 0; display: grid; grid-template-columns: repeat(3, 63.5mm); grid-auto-rows: 38.1mm; column-gap: 2.5mm; margin: 0 auto; }
.lab { display: flex; align-items: center; gap: 2.5mm; padding: 2.5mm 3mm; overflow: hidden; font-family: Inter, sans-serif; border: 1px dashed #ddd; }
.lab svg { width: 30mm; height: 30mm; flex: none; }
.lab .t1 { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 12pt; line-height: 1.05; color: #1c3a25; }
.lab .t2 { font-size: 8pt; font-weight: 600; margin-top: 1mm; }
.lab .t3 { font-size: 7pt; color: #555; margin-top: 1mm; }
.lab .big { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 26pt; line-height: 1; color: #1c3a25; }
.sheetwrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; }
  header, footer, .noprint { display: none !important; }
  main { padding: 0; max-width: none; }
  .sheetwrap { margin: 0; padding: 0; overflow: visible; }
  .lab { border: 0; }
}
</style>
</head>
<body>
<header>
  <a href="#">
    <div class="kicker">Home made cider</div>
    <div class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#7fae3a" d="M12 7c-2-1.6-6-1.4-7.4 2-1.5 3.6.4 9.3 3.4 11.4 1.4 1 2.6.6 4 0 1.4.6 2.6 1 4 0 3-2.1 4.9-7.8 3.4-11.4C18 5.6 14 5.4 12 7Z"/><path fill="none" stroke="#b8913c" stroke-width="1.6" stroke-linecap="round" d="M12 7c0-2 .6-3.4 2-4.4"/><path fill="#cfe2a8" d="M12.6 5.6c1.2-1.8 3.4-2.4 5-1.8-.8 1.8-3 2.6-5 1.8Z"/></svg>
      <span>Green Lady</span>
    </div>
    <div class="vintage" id="vintage"></div>
  </a>
</header>
<nav class="tabs noprint" id="tabs" aria-label="Sections">
  <a href="#barrels" data-tab="barrels">Barrels</a>
  <a href="#blends" data-tab="blends">Blends</a>
  <a href="#bottles" data-tab="bottles">Bottles</a>
</nav>

<main id="main" aria-live="polite">
  <section class="card"><div class="empty">Loading…</div></section>
</main>

<footer>Green Lady cider · made at home, drink responsibly · <a href="#league">league table</a></footer>

<script>
(function () {
  const API = "https://script.google.com/macros/s/AKfycbyPnkwSR5pzMQDO_WFrjC0AkbpX5nvJRWnoWK29DAfRdYbD-7YWI2CCphQVP72EBGv5/exec";
  const SITE = "https://mrdanxxx.github.io/green-lady/";
  const QR_LIB = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
  const TAGS = ["Great", "Flat", "Too fizzy", "Sour", "Cloudy", "Too dry", "Too sweet", "Off smell"];
  const RATE = [["Good", "👍", "Loved it"], ["OK", "👌", "OK"], ["Poor", "👎", "Not for me"]];
  const $main = document.getElementById("main");
  let DB = null;
  let FLASH = null;   // "Saved" message shown at the top of the next page drawn

  // ---------- small helpers ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function add(parent, ...kids) { kids.forEach(k => k && parent.appendChild(k)); return parent; }
  function card(title) { const c = el("section", "card"); if (title) c.appendChild(el("h2", null, title)); return c; }
  const tidy = s => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  const day = s => { const m = /^(\d{4}-\d{2}-\d{2})/.exec(String(s || "")); return m ? m[1] : ""; };
  const numv = x => (x === "" || x == null || !isFinite(Number(x))) ? null : Number(x);
  function toDate(s) { const d = new Date(s + "T12:00:00"); return isNaN(d) ? null : d; }
  function fmtDate(s) { const d = toDate(s); return d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : (s || ""); }
  function daysBetween(a, b) {
    const x = toDate(a), y = b ? toDate(b) : new Date();
    if (!x || !y) return null;
    return Math.round((new Date(y.getFullYear(), y.getMonth(), y.getDate()) - new Date(x.getFullYear(), x.getMonth(), x.getDate())) / 86400000);
  }
  function ago(s) { const n = daysBetween(s); return n == null || n < 0 ? null : n === 0 ? "today" : n + (n === 1 ? " day ago" : " days ago"); }
  function months(a, b) { const n = daysBetween(a, b); return n == null || n < 0 ? null : (n / 30.44); }
  const sg = g => (typeof g === "number" ? g.toFixed(3) : "");
  const abv = (og, fg) => Math.max(0, (og - fg) * 131.25);
  const vlabel = v => v != null ? "Green Lady " + v : "Green Lady";
  function stat(grid, k, v, s, small) {
    if (v == null || v === "") return;
    const b = el("div", "stat");
    add(b, el("div", "k", k), el("div", "v" + (small ? " small" : ""), v), s ? el("div", "s", s) : null);
    grid.appendChild(b);
  }
  function setVintage(v) { document.getElementById("vintage").textContent = v != null ? "VINTAGE " + v : ""; }
  function blendLetter(id) { const m = /^\d+(.*)$/.exec(id); return m && m[1] ? m[1] : id; }
  function vesselName(b) { return (/^D/.test(b.id) || /glass/i.test(b.type) ? "Demijohn " : "Barrel ") + b.id; }

  function parseApples(s) {
    return String(s || "").split(/;|\n/).map(tidy).filter(Boolean).map(part => {
      const i = part.indexOf(" - ");
      let left = i >= 0 ? part.slice(0, i) : part, loc = i >= 0 ? part.slice(i + 3).trim() : "";
      const m = /^(.*?)\s*(\d+(?:\.\d+)?\s*%)\s*$/.exec(left);
      return { variety: m ? m[1] : left, share: m ? m[2].replace(/\s+/g, "") : "", location: loc };
    });
  }
  function parseCode(s) {
    const t = String(s || "").toUpperCase().replace(/\s+/g, "");
    const m = /^(\d+[A-Z]+?)-?([BD]\d{2,3})(?:-?(\d{1,4}))?$/.exec(t);
    if (!m) return null;
    const n = m[3] ? m[3].padStart(3, "0") : "";
    return { blend: m[1], barrel: m[2], n, run: m[1] + "-" + m[2], code: m[1] + "-" + m[2] + (n ? "-" + n : "") };
  }

  // ---------- data ----------
  function build(raw) {
    const blends = {}, barrels = {}, order = [], runs = {}, ratings = {};
    (raw.Blends || []).forEach(r => {
      if (!r.Blend) return;
      const id = tidy(r.Blend).toUpperCase();
      let v = numv(r.Vintage);
      if (v == null) { const m = /^(\d+)/.exec(id); v = m ? Number(m[1]) : null; }
      if (v != null && v >= 100) v = v % 100;
      blends[id] = { id, vintage: v, juiced: day(r.Juiced), apples: parseApples(r.Apples), gravity: numv(r.Gravity), ph: numv(r.pH), yeast: tidy(r.Yeast || r.Yiest), notes: String(r.Notes || "").trim() };
    });
    (raw.Barrels || []).forEach(r => {
      if (!r.Barrel) return;
      const id = tidy(r.Barrel).toUpperCase();
      const sk = Object.keys(r).find(k => /^size/i.test(k));
      let size = sk ? r[sk] : "";
      if (size !== "" && /^\d+(\.\d+)?$/.test(String(size))) size = size + " L";
      barrels[id] = { id, size: tidy(size), type: tidy(r.Type), location: tidy(r.Location), notes: tidy(r.Notes), current: null, history: [] };
      // Removed barrels stay in the Sheet (so their bottles keep their history) but leave the list.
      if (tidy(r.Removed)) barrels[id].removed = true; else order.push(id);
    });
    // Accept the Sheet's own headings too (older script versions don't rename them).
    const log = (raw.Log || []).map(e => Object.assign({}, e, { Time: e.Time || e.Date, Yeast: e.Yeast || e.Yiest }))
      .map((e, i) => ({ e, i, t: String(e.Time || "") }))
      .sort((a, b) => (a.t && b.t && a.t !== b.t) ? (a.t < b.t ? -1 : 1) : a.i - b.i).map(x => x.e);
    log.forEach(e => {
      const id = tidy(e.Barrel).toUpperCase(), b = barrels[id];
      if (!b) return;
      const blendId = tidy(e.Blend).toUpperCase();
      let action = tidy(e.Action);
      action = action ? action.charAt(0).toUpperCase() + action.slice(1).toLowerCase() : (blendId ? "Fill" : "Note");
      const ev = { date: day(e.Time), action, blend: blendId, yeast: tidy(e.Yeast), gravity: numv(e.Gravity), ph: numv(e.pH),
                   bottles: numv(e.Bottles), priming: tidy(e.Priming), location: tidy(e.Location), note: String(e.Notes || e.Note || "").trim(), by: tidy(e.By) };
      switch (ev.action) {
        case "Fill":
          if (b.current) b.history.push(b.current);
          b.current = { blend: ev.blend, filled: e.Filled ? day(e.Filled) : ev.date, yeast: ev.yeast, fillYeast: ev.yeast, fillNote: ev.note, fillEv: ev, yeasts: ev.yeast ? [{ name: ev.yeast, date: ev.date, note: "", by: ev.by }] : [],
                        events: ev.note || ev.gravity != null || ev.ph != null ? [ev] : [], by: ev.by };
          break;
        case "Moved":
          if (ev.location) b.location = ev.location;
          if (b.current) b.current.events.push(ev);
          break;
        case "Reading": case "Note":
          if (b.current) {
            if (ev.yeast) { b.current.yeast = ev.yeast; b.current.yeasts.push({ name: ev.yeast, date: ev.date, note: ev.note, by: ev.by }); }
            else b.current.events.push(ev);
          }
          break;
        case "Bottled": {
          const fill = b.current || { blend: ev.blend, filled: "", events: [] };
          const blend = ev.blend || fill.blend;
          const fg = ev.gravity != null ? ev.gravity : lastGravity(fill.events);
          fill.bottled = ev;
          runs[blend + "-" + id] = { key: blend + "-" + id, blend, barrel: id, yeast: fill.yeast || "", yeasts: fill.yeasts || [], filled: fill.filled, bottled: ev.date, bottles: ev.bottles,
                                     priming: ev.priming, fg, by: ev.by, note: ev.note, events: fill.events };
          b.history.push(fill);
          b.current = null;
          break;
        }
        case "Empty":
          if (b.current) { b.current.emptied = ev; b.history.push(b.current); }
          b.current = null;
          break;
      }
    });
    (raw.Ratings || []).forEach(r => {
      const p = parseCode(r.Bottle);
      if (!p || !["Good", "OK", "Poor"].includes(r.Rating)) return;
      const k = p.run;
      const a = ratings[k] || (ratings[k] = { Good: 0, OK: 0, Poor: 0, n: 0, tags: {} });
      a[r.Rating]++; a.n++;
      String(r.Tags || "").split(",").map(tidy).filter(Boolean).forEach(t => a.tags[t] = (a.tags[t] || 0) + 1);
      if (!runs[k]) runs[k] = { key: k, blend: p.blend, barrel: p.barrel };
    });
    return { blends, barrels, order, runs, ratings };
  }
  function lastGravity(events) {
    const g = (events || []).filter(e => e.gravity != null);
    return g.length ? g[g.length - 1].gravity : null;
  }

  function actionForm(b, action, bare) {
    const f = el("form"), inputs = {};
    if (bare) f.style.marginTop = "0";
    else f.appendChild(el("h3", null, LABEL[action] + " · " + b.id));
    FIELDS[action].forEach(([k, label, kind, hint]) => {
      const l = el("label");
      l.appendChild(document.createTextNode(label));
      let inp;
      if (kind === "blend") {
        inp = el("select");
        Object.keys(DB.blends).sort().reverse().forEach(id => {
          const o = el("option", null, id + " · " + DB.blends[id].apples.map(x => x.variety).join(", "));
          o.value = id; inp.appendChild(o);
        });
        if (!inp.options.length) { const o = el("option", null, "No blends in the Sheet yet"); o.value = ""; inp.appendChild(o); }
      } else if (kind === "text") {
        inp = el("textarea");
      } else {
        inp = el("input");
        if (kind === "gravity") { inp.inputMode = "decimal"; inp.placeholder = "1.010"; }
        if (kind === "ph") { inp.inputMode = "decimal"; inp.placeholder = "3.5"; }
        if (kind === "int") { inp.inputMode = "numeric"; inp.placeholder = "23"; }
        if (kind === "short" && hint) inp.placeholder = hint;
        if (kind === "yeast") {
          const dl = el("datalist"); dl.id = "yeasts";
          const ys = new Set();
          Object.values(DB.blends).forEach(x => x.yeast && ys.add(x.yeast));
          DB.order.forEach(id => { const bb = DB.barrels[id]; [bb.current, ...bb.history].forEach(f => f && f.yeast && ys.add(f.yeast)); });
          ys.forEach(x => { const o = el("option"); o.value = x; dl.appendChild(o); });
          l.appendChild(dl); inp.setAttribute("list", "yeasts"); inp.placeholder = "e.g. SafCider TF-6";
        }
        if (kind === "location") {
          const dl = el("datalist"); dl.id = "locs";
          [...new Set(DB.order.map(id => DB.barrels[id].location).filter(Boolean))].forEach(x => { const o = el("option"); o.value = x; dl.appendChild(o); });
          l.appendChild(dl); inp.setAttribute("list", "locs");
        }
      }
      inputs[k] = inp;
      l.appendChild(inp);
      f.appendChild(l);
    });
    if (inputs.blend && inputs.yeast) {
      const fillYeast = () => { const bl = DB.blends[inputs.blend.value]; if (bl && bl.yeast && !inputs.yeast.dataset.typed) inputs.yeast.value = bl.yeast; };
      inputs.yeast.addEventListener("input", () => { inputs.yeast.dataset.typed = "1"; });
      inputs.blend.addEventListener("change", fillYeast);
      fillYeast();
    }
    // Bottle it: print the bottle labels from here (batch = this blend in this barrel).
    if (action === "Bottled" && b.current) {
      const run = b.current.blend + "-" + b.id;
      const first = input("1", { inputMode: "numeric" });
      const mk = el("button", "primary full", "Make labels"); mk.type = "button";
      const lbox = add(el("div", "confirm"), el("h3", null, "Print bottle labels"), field("First number", first, "Uses “How many bottles?” above. Batch " + run), mk);
      lbox.querySelector("h3").style.marginTop = "0";
      mk.addEventListener("click", () => {
        const n = parseInt(inputs.bottles.value, 10);
        if (!n) return show("Enter how many bottles first.");
        location.hash = "labels/" + run + "/" + n + "/" + (parseInt(first.value, 10) || 1);
      });
      f.appendChild(lbox);
    }
    const auth = pinFields(f);
    const msg = el("div", "msg"); msg.hidden = true;
    const save = el("button", "primary full", bare ? "Save note" : "Save");
    if (bare && inputs.note) { inputs.note.placeholder = "e.g. Bubbling well, smells sweet"; inputs.note.parentNode.firstChild.remove(); inputs.note.setAttribute("aria-label", "Note"); }
    add(f, save, msg);

    f.addEventListener("submit", async ev => {
      ev.preventDefault();
      const body = { kind: "log", action: action === "Yeast" ? "Note" : action, barrel: b.id };
      Object.keys(inputs).forEach(k => body[k] = inputs[k].value.trim());
      if (action === "Yeast" && !body.yeast) return show("Which yeast?");
      if (action === "Fill" && !body.blend) return show("Create the blend first: Blends tab → + New blend.");
      if (action === "Bottled") body.blend = b.current ? b.current.blend : "";
      if (body.gravity) body.gravity = gravityVal(body.gravity);
      for (const k of ["gravity", "ph", "bottles"]) {
        if (body[k] && !isFinite(Number(body[k].replace(",", ".")))) return show("That " + (k === "ph" ? "pH" : k) + " doesn't look like a number.");
        if (body[k]) body[k] = body[k].replace(",", ".");
      }
      if (action === "Reading" && !body.gravity && !body.ph && !body.note) return show("Enter a gravity, pH or note.");
      if (action === "Moved" && !body.location) return show("Where has it gone?");
      if (!await pinPost(body, auth, save, show)) return;
      const DONE = { Bottled: "Bottled", Empty: "Emptied", Fill: "Filled", Note: "Note saved", Reading: "Reading saved", Yeast: "Yeast saved", Moved: "Moved" };
      FLASH = { text: (DONE[action] || "Saved") + ": " + b.id + "." };
      route();
    });
    function show(t) { msg.className = "msg err"; msg.textContent = t; msg.hidden = false; }
    return f;
  }

  function suggest(inp, id, values) {   // typing suggestions from what's already in the records

      [...new Set(values.map(tidy).filter(Boolean))].sort().forEach(v => { const o = el("option"); o.value = v; dl.appendChild(o); });
    }
    inp.setAttribute("list", id);
  }
  function knownYeasts() {
    const ys = [];
    Object.values(DB.blends).forEach(x => ys.push(x.yeast));
    DB.order.forEach(id => { const bb = DB.barrels[id]; [bb.current, ...bb.history].forEach(f => f && ys.push(f.yeast)); });
    return ys;
  }
  const knownLocations = () => DB.order.map(id => DB.barrels[id].location);
  function gravityVal(s) {   // "1050" or "1,050" -> "1.05"; "" stays ""; nonsense -> "x" (caught by the number checks)
    s = String(s || "").trim().replace(",", ".");
    if (!s) return "";
    const n = Number(s);
    if (!isFinite(n)) return "x";
    return String(n > 100 ? n / 1000 : n);
  }
  const pad2 = n => String(n).padStart(2, "0");
  function isoToday() { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function pinFields(f) {
    const by = input(store.get("gl-name") || "", { autocomplete: "given-name" });
    const pin = input(store.get("gl-pin") || "", { type: "password", inputMode: "numeric" });
    add(f, add(el("div", "two"), field("Your name", by), field("PIN NUMBER", pin)));
    return { by, pin };
  }
  // Sends a PIN-protected change. Returns true once saved and the records are reloaded.
  async function pinPost(body, auth, btn, show) {
    body.pin = auth.pin.value.trim();
    body.by = auth.by.value.trim();
    if (!body.pin) { show("Enter the PIN number."); return false; }
    const txt = btn.textContent;
    btn.disabled = true; btn.textContent = "Saving…";
    let r;
    try { r = await post(body); }
    catch (e) { btn.disabled = false; btn.textContent = txt; show("No connection – nothing was saved. Try again."); return false; }
    if (!r.ok) {
      if (/pin/i.test(r.error || "")) store.del("gl-pin");
      btn.disabled = false; btn.textContent = txt;
      show(/pin/i.test(r.error || "") ? "Wrong PIN number." : (r.error || "Couldn't save."));
      return false;
    }
    store.set("gl-pin", body.pin);
    if (body.by) store.set("gl-name", body.by);
    try { await load(); } catch (e) { btn.textContent = "Saved"; show("Saved, but couldn't refresh. Reload the page to see it."); return false; }
    return true;
  }
  function formCard(title, tab) {
    page(title, tab);
    const c = card(title);

  }
  function formEnd(f, saveText, cancelHref) {

  }

  // ----- add / edit a barrel -----
  function nextBarrelId() {
    let n = 0;
    Object.keys(DB.barrels).forEach(id => { const m = /^B(\d+)$/.exec(id); if (m) n = Math.max(n, Number(m[1])); });
    return "B" + pad2(n + 1);
  }
  function barrelForm(b) {
    const f = formCard(b ? "Edit " + vesselName(b) : "Add a barrel", "barrels");

      idIn = input(nextBarrelId(), { autocomplete: "off", placeholder: "B21" });

    }
    const size = input(b ? String(b.size).replace(/\s*(l|ltr|litres?|liters?)\.?$/i, "") : "", { inputMode: "decimal", placeholder: "30" });
    const type = input(b ? b.type : "", { placeholder: "Plastic" });
    suggest(type, "dl-types", ["Plastic", "Glass demijohn", "Oak", "Stainless steel"].concat(DB.order.map(id => DB.barrels[id].type)));
    const loc = input(b ? b.location : "", { placeholder: "Greenacres" });
    suggest(loc, "dl-locs", knownLocations());
    add(f, add(el("div", "two"), field("Size (litres)", size), field("Type", type)), field("Where is it?", loc));
    const auth = pinFields(f);
    const { save, show } = formEnd(f, b ? "Save changes" : "Add barrel", "#barrels");
    if (b) {
      // Delete: the row stays in the Sheet marked "Removed", so bottles from it keep their history.
      const del = el("button", "danger full", "Delete barrel");
      del.type = "button"; del.style.marginTop = "8px";
      f.appendChild(del);
      // In-page "are you sure?" instead of a browser pop-up.
      const ask = el("div", "confirm"); ask.hidden = true;
      const yes = el("button", "danger-solid", "Yes, delete"), no = el("button", "soft", "No");
      yes.type = no.type = "button";

      del.addEventListener("click", () => { del.hidden = true; ask.hidden = false; });
      no.addEventListener("click", () => { ask.hidden = true; del.hidden = false; });
      yes.addEventListener("click", async () => {
        // A full barrel is emptied first, so its cider doesn't come back if the number is re-used.
        if (b.current && !await pinPost({ kind: "log", action: "Empty", barrel: b.id, blend: b.current.blend, note: "Barrel deleted" }, auth, yes, show)) return;
        if (!await pinPost({ kind: "barrel", remove: true, barrel: b.id }, auth, yes, show)) return;
        FLASH = { text: vesselName(b) + " deleted." };

      });
    }
    f.addEventListener("submit", async ev => {
      ev.preventDefault();

      if (!b && DB.barrels[id] && !DB.barrels[id].removed) return show(id + " already exists.");

      const where = loc.value.trim();
      const body = { kind: "barrel", isNew: !b, barrel: id, size: sz, type: type.value.trim(), location: where, notes: b ? b.notes : "",   // no notes box; keep any already in the Sheet
                     moved: !!b && !!where && where !== b.location };
      if (!await pinPost(body, auth, save, show)) return;

  // ----- new / edit a blend -----
  function nextBlendId() {
    const v = new Date().getFullYear() % 100;
    let max = 64;   // "@", so the first one is A
    Object.keys(DB.blends).forEach(id => { const m = /^(\d+)([A-Z])$/.exec(id); if (m && Number(m[1]) === v) max = Math.max(max, m[2].charCodeAt(0)); });
    return v + (max < 90 ? String.fromCharCode(max + 1) : "");
  }
  function blendForm(bl) {
    const f = formCard(bl ? "Edit blend " + bl.id : "New blend", "blends");
    let idIn = null;
    if (!bl) {
      idIn = input(nextBlendId(), { autocomplete: "off", placeholder: "26D" });
      idIn.style.textTransform = "uppercase";
      f.appendChild(field("Blend code", idIn, "Vintage year + letter, e.g. 26D"));
    }
    const juiced = input(bl ? bl.juiced : isoToday(), { type: "date" });
    f.appendChild(field("Date juiced", juiced));

    // apples: one row per variety
    f.appendChild(el("h3", null, "Apples"));
    const varieties = [], places = [];
    Object.values(DB.blends).forEach(x => x.apples.forEach(a => { varieties.push(a.variety); places.push(a.location); }));
    const rows = el("div", "applerows"), tot = el("div", "total");
    function addRow(a) {
      a = a || {};
      const r = el("div", "applerow");
      const v = input(a.variety || "", { placeholder: "Variety, e.g. Dabinett" });
      suggest(v, "dl-varieties", varieties);
      const sh = input((a.share || "").replace("%", ""), { inputMode: "decimal", placeholder: "%" });
      sh.classList.add("share"); sh.setAttribute("aria-label", "Percent of the blend");
      const x = el("button", null, "×"); x.type = "button"; x.setAttribute("aria-label", "Remove this apple");
      const lo = input(a.location || "", { placeholder: "Where from? e.g. Home Farm" });
      lo.classList.add("loc");
      suggest(lo, "dl-places", places);
      x.addEventListener("click", () => { r.remove(); total(); });
      sh.addEventListener("input", total);
      add(r, v, sh, x, lo);
      rows.appendChild(r);
      return v;
    }
    function total() {
      let t = 0, any = false;
      rows.querySelectorAll(".share").forEach(s => { const n = Number(s.value.replace(",", ".")); if (s.value.trim() && isFinite(n)) { t += n; any = true; } });
      const off = Math.abs(t - 100) > 0.01;
      tot.textContent = any ? "Total " + Number(t.toFixed(1)) + "%" + (off ? " – should add up to 100%" : " ✓") : "";
      tot.classList.toggle("bad", any && off);
    }
    (bl && bl.apples.length ? bl.apples : [{}, {}]).forEach(a => addRow(a));
    const more = el("button", null, "+ Add another apple"); more.type = "button";
    more.addEventListener("click", () => addRow().focus());
    add(f, rows, tot, more);
    total();

    f.appendChild(el("h3", null, "Juice"));
    const grav = input(bl && bl.gravity != null ? sg(bl.gravity) : "", { inputMode: "decimal", placeholder: "1.050" });
    const ph = input(bl && bl.ph != null ? String(bl.ph) : "", { inputMode: "decimal", placeholder: "3.5" });
    const yeast = input(bl ? bl.yeast : "", { placeholder: "e.g. SafCider TF-6" });
    suggest(yeast, "dl-yeasts", knownYeasts());
    add(f, add(el("div", "two"), field("Starting gravity", grav), field("Starting pH", ph)), field("Yeast", yeast));
    const auth = pinFields(f);
    const { save, show } = formEnd(f, bl ? "Save changes" : "Save blend", bl ? "#blend/" + bl.id : "#blends");

    f.addEventListener("submit", async ev => {
      ev.preventDefault();
      const id = bl ? bl.id : idIn.value.trim().toUpperCase().replace(/\s+/g, "");
      if (!/^\d{2}[A-Z]{1,2}$/.test(id)) return show("Blend codes look like 26D (year + letter).");
      if (!bl && DB.blends[id]) return show("Blend " + id + " already exists.");
      const apples = [];
      for (const r of rows.querySelectorAll(".applerow")) {
        const [v, sh, , lo] = r.children;
        const name = tidy(v.value).replace(/[;%]/g, ""), share = sh.value.trim().replace(",", "."), place = tidy(lo.value).replace(/;/g, ",");
        if (!name) { if (share || place) return show("One of the apple rows has no variety."); continue; }
        if (share && !isFinite(Number(share))) return show("The % for " + name + " isn't a number.");
        apples.push(name + (share ? " " + Number(share) + "%" : "") + (place ? " - " + place : ""));
      }
      const g = gravityVal(grav.value), p = ph.value.trim().replace(",", ".");
      if (g === "x") return show("Starting gravity doesn't look like a number (e.g. 1.050).");
      if (p && !isFinite(Number(p))) return show("pH doesn't look like a number (e.g. 3.5).");
      const body = { kind: "blend", isNew: !bl, blend: id, juiced: juiced.value, apples: apples.join("; "), gravity: g, ph: p,
                     yeast: yeast.value.trim(), notes: bl ? bl.notes : "" };   // notes no longer shown; keep whatever is in the Sheet
      if (!await pinPost(body, auth, save, show)) return;
      FLASH = { text: bl ? "Saved changes to blend " + id + "." : "Saved blend " + id + ". You can now fill barrels with it (Barrels → barrel → Fill)." };
      location.hash = "blend/" + id;
    });
  }

  function rateCard(p) {
    const c = card("How was it?");
    const key = "gl-rated-" + p.code;
    const prev = store.get(key);
    const agg = DB.ratings[p.run];
    if (prev) {
      c.appendChild(el("p", null, "Thanks – you rated this bottle " + (RATE.find(r => r[0] === prev) || ["", "", prev])[1] + " " + prev + "."));
      c.appendChild(el("h3", null, "What everyone thought of this batch"));
      c.appendChild(ratingBar(agg));
      const again = el("button", null, "Change my rating"); again.type = "button"; again.style.marginTop = "12px";
      again.addEventListener("click", () => { store.del(key); c.replaceWith(rateCard(p)); });
      c.appendChild(again);
      return c;
    }
    let choice = null;
    const tags = new Set();
    const row = el("div", "rate");
    RATE.forEach(([k, e, label]) => {
      const bt = el("button", k); bt.type = "button";
      add(bt, el("span", "e", e), el("span", null, label));
      bt.addEventListener("click", () => {
        choice = k;
        row.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === bt));
        extra.hidden = false; send.disabled = false;
      });
      row.appendChild(bt);
    });
    c.appendChild(row);
    const extra = el("div"); extra.hidden = true;
    extra.appendChild(el("h3", null, "Anything stand out? (optional)"));
    const chips = el("div", "chips");
    TAGS.forEach(t => {
      const ch = el("button", null, t); ch.type = "button";
      ch.addEventListener("click", () => { tags.has(t) ? tags.delete(t) : tags.add(t); ch.classList.toggle("on"); });
      chips.appendChild(ch);
    });
    extra.appendChild(chips);
    const f = el("form");
    const ln = el("label"); ln.appendChild(document.createTextNode("Your first name ")); ln.lastChild.after(el("small", null, "optional"));
    const name = el("input"); name.value = store.get("gl-name") || ""; ln.appendChild(name);
    const lc = el("label"); lc.appendChild(document.createTextNode("Comment ")); lc.lastChild.after(el("small", null, "optional, only the cider maker sees it"));
    const comment = el("textarea"); lc.appendChild(comment);
    const send = el("button", "primary full", "Send rating"); send.disabled = true;
    const msg = el("div", "msg err"); msg.hidden = true;
    add(f, ln, lc, send, msg);
    extra.appendChild(f);
    c.appendChild(extra);
    if (agg && agg.n) { c.appendChild(el("h3", null, "So far")); c.appendChild(ratingBar(agg)); }

    f.addEventListener("submit", async ev => {
      ev.preventDefault();
      if (!choice) return;
      send.disabled = true; send.textContent = "Sending…";
      try {
        const r = await post({ kind: "rating", bottle: p.code, rating: choice, tags: [...tags].join(", "), name: name.value.trim(), comment: comment.value.trim() });
        if (!r.ok) throw new Error(r.error);
        store.set(key, choice);
        if (name.value.trim()) store.set("gl-name", name.value.trim());
        await load();
        c.replaceWith(rateCard(p));
      } catch (e) {
        send.disabled = false; send.textContent = "Send rating";
        msg.textContent = "Couldn't send – check your connection and try again."; msg.hidden = false;
      }
    });
    return c;
  }

        const left = el("div"); left.style.flex = "1";
        add(left, el("div", "name", "Blend " + id), ratingBar(byBlend[id]));
        const right = el("div", "right"); right.appendChild(el("div", "score", Math.round(score(byBlend[id]) * 100) + "%"));
        add(a, left, right); l2.appendChild(a);
      });
      $main.appendChild(add(c2, l2));
    }
  }

  // ----- printable labels -----
  let qrLoading = null;
  function loadQR() {
    if (window.qrcode) return Promise.resolve();
    return qrLoading || (qrLoading = new Promise((ok, bad) => { const s = document.createElement("script"); s.src = QR_LIB; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }));
  }
  function qrSvg(text) {
    const q = window.qrcode(0, "M"); q.addData(text); q.make();
    const tmp = document.createElement("div"); tmp.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    return tmp.firstChild;
  }
  async function labels(arg) {
    setVintage(null);
    document.title = "Labels · Green Lady";
    setTab(arg === "barrels" ? "barrels" : "bottles");
    $main.replaceChildren(add(card(), el("div", "empty", "Making labels…")));
    try { await loadQR(); } catch (e) { $main.replaceChildren(add(card(), el("div", "msg err", "Couldn't load the QR maker. Check the connection."))); return; }
    $main.replaceChildren();
    const ctl = card(arg === "barrels" ? "Barrel QR stickers" : "Bottle labels");
    ctl.classList.add("noprint");
    ctl.appendChild(el("p", "sub", "Sized for A4 sheets of 21 labels (63.5 × 38.1 mm, e.g. Avery L7160). Print at 100% / actual size."));
    const sheetWrap = el("div", "sheetwrap");
    let items = [];
    if (arg === "barrels") {
      items = DB.order.map(id => ({ url: SITE + "#" + id, big: id, t3: [DB.barrels[id].size, "Green Lady"].filter(Boolean).join(" · ") }));
    } else {
      const m = /^([^/]+)\/(\d+)(?:\/(\d+))?$/.exec(arg), p = m && parseCode(m[1]);
      if (!p) { barrelsTab("Label link not recognised."); return; }
      const count = Math.min(500, parseInt(m[2], 10) || 24), start = parseInt(m[3] || "1", 10) || 1;
      const bl = DB.blends[p.blend];
      const f = el("form", "two"); f.style.marginTop = "0";
      const l1 = el("label"); l1.appendChild(document.createTextNode("How many")); const i1 = el("input"); i1.inputMode = "numeric"; i1.value = count; l1.appendChild(i1);
      const l2 = el("label"); l2.appendChild(document.createTextNode("First number")); const i2 = el("input"); i2.inputMode = "numeric"; i2.value = start; l2.appendChild(i2);
      add(f, l1, l2);
      const upd = () => { location.hash = "labels/" + p.run + "/" + (parseInt(i1.value, 10) || 1) + "/" + (parseInt(i2.value, 10) || 1); };
      i1.addEventListener("change", upd); i2.addEventListener("change", upd);
      f.addEventListener("submit", e => { e.preventDefault(); upd(); });
      ctl.appendChild(f);
      for (let n = start; n < start + count; n++) {
        const code = p.run + "-" + String(n).padStart(3, "0");
        items.push({ url: SITE + "#" + code, t1: vlabel(bl ? bl.vintage : null), t2: "Blend " + blendLetter(p.blend) + " · " + p.barrel + " · No. " + String(n).padStart(3, "0"), t3: "Scan me & rate me" });
      }
    }
    const pr = el("button", "primary full", "Print"); pr.type = "button"; pr.style.marginTop = "12px";
    pr.addEventListener("click", () => window.print());
    ctl.appendChild(pr);
    $main.appendChild(ctl);
    const sheet = el("div", "sheet");
    items.forEach(it => {
      const lab = el("div", "lab"), txt = el("div");
      lab.appendChild(qrSvg(it.url));
      if (it.big) add(txt, el("div", "big", it.big), el("div", "t3", it.t3));
      else add(txt, el("div", "t1", it.t1), el("div", "t2", it.t2), el("div", "t3", it.t3));
      lab.appendChild(txt);
      sheet.appendChild(lab);
    });
    $main.appendChild(add(sheetWrap, sheet));
  }

  // ---------- routing ----------
  function route() {
    window.scrollTo(0, 0);
    const raw = decodeURIComponent(location.hash.slice(1)).trim();
    const up = raw.toUpperCase();
    let m;
    if (!raw || up === "BARRELS") barrelsTab();
    else if (up === "BARRELS/NEW") barrelForm(null);
    else if ((m = /^([A-Z]\d{2,3})(\/.*)?$/.exec(up)) && DB.barrels[m[1]] && DB.barrels[m[1]].removed) barrelsTab(m[1] + " has been deleted.");
    else if (up === "BLENDS") blendsTab();
    else if (up === "BLENDS/NEW") blendForm(null);
    else if (up === "BOTTLES") bottlesTab();
    else if (up === "LEAGUE") league();
    else if (/^labels\//i.test(raw)) { FLASH = null; return labels(raw.slice(7)); }
    else if ((m = /^BLEND\/([^/]+)\/EDIT$/.exec(up)) && DB.blends[m[1]]) blendForm(DB.blends[m[1]]);
    else if ((m = /^BLEND\/([^/]+)$/.exec(up)) && DB.blends[m[1]]) blendPage(m[1]);
    else if ((m = /^([A-Z]\d{2,3})\/EDIT$/.exec(up)) && DB.barrels[m[1]]) barrelForm(DB.barrels[m[1]]);
    else if ((m = /^([A-Z]\d{2,3})\/FILL$/.exec(up)) && DB.barrels[m[1]] && DB.barrels[m[1]].current) fillForm(DB.barrels[m[1]]);
    else if ((m = /^([A-Z]\d{2,3})\/FILL$/.exec(up)) && DB.barrels[m[1]]) barrelPage(DB.barrels[m[1]]);
    else if (DB.barrels[up]) barrelPage(DB.barrels[up]);
    else if (parseCode(up)) bottlePage(parseCode(up));
    else if (DB.blends[up]) blendPage(up);
    else barrelsTab("This tag (" + raw + ") isn't linked to a barrel or bottle yet.");
    if (FLASH) {
      const ok = el("div", "msg ok gap", FLASH.text);
      $main.insertBefore(ok, $main.firstChild);
      if (FLASH.link) { const a = el("a", "button primary full", FLASH.link.text); a.href = FLASH.link.href; a.style.marginBottom = "16px"; ok.after(a); }
      FLASH = null;
    }
  }

  window.addEventListener("hashchange", route);
  load().then(route).catch(() => {
    $main.replaceChildren(add(card(), el("div", "msg err", "Couldn't reach the cider records. Check your connection and refresh.")));
  });
})();
</script>
</body>
</html>
