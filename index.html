    if (run && (run.priming || run.note)) $main.appendChild(add(card("Bottling"), el("p", "notes", [run.priming ? "Priming: " + run.priming : "", run.note].filter(Boolean).join("\n"))));
    const bad = bottleProblem(p);   // e.g. a mistyped code or a link to a bottle that doesn't exist
    $main.appendChild(bad ? add(card("How was it?"), el("div", "msg err", bad + " Check the code on the label.")) : rateCard(p));   // rating goes last, below Bottling
  }

  function rateCard(p) {
    const c = card("How was it?");
    // Ratings are per bottle: on a batch page (no bottle number) ask for the number on the label first.
    const runN = DB.runs[p.run] && Number(DB.runs[p.run].bottles);
    if (!p.n && runN) {   // pick the number on the label from a grid, as on Find my bottle
      c.appendChild(el("p", "sub", "Each bottle is rated on its own. Choose the number on your bottle's label."));
      const items = Array.from({ length: Math.min(runN, 99) }, (_, i) => { const n = String(i + 1).padStart(2, "0"); return { value: n, main: n }; });
      const l = el("div", "lbl"); l.style.marginTop = "10px";
      add(l, el("div", "lbl-t", "Bottle"), pickBox("Choose the number on your label…", items, n => { location.hash = p.run + "-" + n; }, true));
      return add(c, l);
    }
    if (!p.n) {
      c.appendChild(el("p", "sub", "Each bottle is rated on its own. Type the number from the bottle's label."));
      const f = el("form", "codebox"); f.style.marginTop = "10px";
      const num = input("", { inputMode: "numeric", placeholder: "e.g. 31", autocomplete: "off" });
      num.setAttribute("aria-label", "Bottle number");
      const go = el("button", "primary", "Rate this bottle");
      const msg = el("div", "msg err"); msg.hidden = true; msg.style.marginTop = "10px";
      add(f, num, go);
      f.addEventListener("submit", ev => {
        ev.preventDefault();
        const n = parseInt(num.value, 10);
        if (!n || n < 1) { msg.textContent = "Type the bottle number, e.g. 31."; msg.hidden = false; return; }
        const bad = bottleProblem(parseCode(p.run + "-" + n));
        if (bad) { msg.textContent = bad; msg.hidden = false; return; }
        location.hash = p.run + "-" + String(n).padStart(2, "0");
      });
      return add(c, f, msg);
    }
    const key = "gl-rated-" + p.code;
    const prev = store.get(key);
    const agg = DB.ratings[p.run];
    if (prev) {   // one rating per bottle per phone; it can't be changed
      c.appendChild(el("p", null, "Thanks – you rated this bottle " + (RATE.find(r => r[0] === prev) || ["", "", prev])[1] + " " + (RATE.find(r => r[0] === prev) || ["", "", prev])[2] + "."));
      c.appendChild(el("h3", null, "What everyone thought of this batch"));
      c.appendChild(ratingBar(agg));
      return c;
    }
    let choice = null;
    const tags = new Set();
    const row = el("div", "rate");
    RATE.forEach(([k, e, label, , col]) => {
      const bt = el("button", k); bt.type = "button"; bt.style.setProperty("--c", col);
      add(bt, el("span", "e", e), el("span", null, label));
      bt.addEventListener("click", () => {
        choice = k;
        row.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === bt));
        extra.hidden = false; send.disabled = false;
      });
      row.appendChild(bt);
    });
    c.appendChild(row);
    const extra = el("div"); extra.hidden = true;
    extra.appendChild(el("h3", null, "Anything stand out? (optional)"));
    const chips = el("div", "chips");
    TAGS.forEach(t => {
      const ch = el("button", null, t); ch.type = "button";
      ch.addEventListener("click", () => { tags.has(t) ? tags.delete(t) : tags.add(t); ch.classList.toggle("on"); });
      chips.appendChild(ch);
    });
    extra.appendChild(chips);
    const f = el("form");
    const ln = el("label"); ln.appendChild(document.createTextNode("Your first name ")); ln.lastChild.after(el("small", null, "optional, shown with your review"));
    const name = el("input"); name.value = store.get("gl-name") || ""; ln.appendChild(name);
    const lc = el("label"); lc.appendChild(document.createTextNode("Comment ")); lc.lastChild.after(el("small", null, "optional, everyone can see it"));
    const comment = el("textarea"); lc.appendChild(comment);
    const send = el("button", "primary full", "Send rating"); send.disabled = true;
    const msg = el("div", "msg err"); msg.hidden = true;
    add(f, ln, lc, send, msg);
    extra.appendChild(f);
    c.appendChild(extra);

    f.addEventListener("submit", async ev => {
      ev.preventDefault();
      if (!choice) return;
      send.disabled = true; send.textContent = "Sending…";
      try {
        const r = await post({ kind: "rating", bottle: p.code, rating: choice, tags: [...tags].join(", "), name: name.value.trim(), comment: comment.value.trim() });
        if (!r.ok) throw new Error(r.error);
        store.set(key, choice);
        if (name.value.trim()) store.set("gl-name", name.value.trim());
        await load();
        c.replaceWith(rateCard(p));
      } catch (e) {
        send.disabled = false; send.textContent = "Send rating";
        msg.textContent = "Couldn't send – check your connection and try again."; msg.hidden = false;
      }
    });
    return c;
  }

  // ----- blend page -----
  function blendPage(id) {
    const blend = DB.blends[id];
    setVintage(blend.vintage);
    document.title = "Blend " + id + " · Green Lady";
    setTab("blends");
    $main.replaceChildren();
    window.scrollTo(0, 0);
    const top = card(), head = el("div", "head");
    add(head, el("h1", null, vlabel(blend.vintage) + " · Blend " + blendLetter(id)));
    top.appendChild(head);
    const grid = el("div", "stats"); blendStats(grid, blend); top.appendChild(grid);
    $main.appendChild(top);
    add($main, applesCard(blend), yeastCard(null, blend.yeast));
    const c = card("Where it went"), list = el("div", "list");
    DB.order.map(b => DB.barrels[b]).filter(b => b.current && b.current.blend === id).forEach(b => {
      const a = el("a"); a.href = "#" + b.id;
      const left = el("div"); add(left, el("div", "name", vesselName(b)), el("div", "sub", "In barrel · filled " + fmtDate(b.current.filled)));
      add(a, left, el("span", "sub", "›")); list.appendChild(a);
    });
    Object.values(DB.runs).filter(r => r.blend === id && r.bottled).forEach(r => {
      const a = el("a"); a.href = "#" + r.key;
      const left = el("div"); add(left, el("div", "name", "Bottled from " + r.barrel), el("div", "sub", fmtDate(r.bottled) + (r.bottles ? " · " + r.bottles + " bottles" : "")));
      add(a, left, el("span", "sub", "›")); list.appendChild(a);
    });
    if (!list.children.length) list.appendChild(el("div", "muted", "Not in any barrel yet."));
    $main.appendChild(add(c, list));
    const ce = card(), ed = el("a", "button primary full", "Edit this blend");
    ed.href = "#blend/" + id + "/edit";
    $main.appendChild(add(ce, ed));
  }

  // ----- league table -----
  // League tab: Blend rating -> Barrel rating -> Bottle rating, with Back at each step.
  function league(level) {
    level = level || "blends";
    setVintage(null);
    document.title = "League table · Green Lady";
    setTab("league");
    $main.replaceChildren();
    window.scrollTo(0, 0);
    const LV = {
      blends:  { title: "Best Blends",  sub: "Each blend, all its barrels and bottles together, best rated first." },
      barrels: { title: "Best Barrels", sub: "Each bottling run (one blend from one barrel), best rated first." },
      bottles: { title: "Best Bottles", sub: "Each numbered bottle, best rated first." },
    }[level];
    // three tabs inside the League tab
    const sub = el("nav", "subtabs");
    [["blends", "Best Blends", "#league"], ["barrels", "Best Barrels", "#league/barrels"], ["bottles", "Best Bottles", "#league/bottles"]].forEach(([k, t, h]) => {
      const a = el("a", k === level ? "on" : null, t); a.href = h; sub.appendChild(a);
    });
    $main.appendChild(sub);
    const c = card(LV.title);
    c.appendChild(el("p", "sub", LV.sub + " Score: " + RATE.map(r => r[1] + " " + Math.round(r[3] * 100) + "%").join(" · ")));

    // rows: { href, name, sub, agg }
    let rows = [];
    if (level === "blends") {
      const byBlend = {};
      Object.keys(DB.ratings).forEach(k => {
        const a = DB.ratings[k], r = DB.runs[k]; if (!a.n || !r) return;
        const t = byBlend[r.blend] || (byBlend[r.blend] = newAgg());
        addAgg(t, a);
        Object.entries(a.tags).forEach(([x, v]) => t.tags[x] = (t.tags[x] || 0) + v);
      });
      rows = Object.keys(byBlend).map(id => {
        const bl = DB.blends[id];
        return { href: "#league/blend/" + id, name: (bl ? vlabel(bl.vintage) + " · " : "") + "Blend " + blendLetter(id),
                 sub: bl ? bl.apples.map(x => x.variety).join(", ") : "", agg: byBlend[id] };
      });
    } else if (level === "barrels") {
      rows = Object.values(DB.runs).filter(r => DB.ratings[r.key] && DB.ratings[r.key].n).map(r => {
        const bl = DB.blends[r.blend], br = DB.barrels[r.barrel];
        const m = r.filled && r.bottled ? months(r.filled, r.bottled) : null;
        return { href: "#league/barrel/" + r.key, name: (bl ? vlabel(bl.vintage) + " · " : "") + "Blend " + blendLetter(r.blend) + " · " + r.barrel,
                 sub: [bl ? bl.apples.map(x => x.variety).join(", ") : null, r.yeast || (bl && bl.yeast), br && br.size, m != null ? m.toFixed(1) + " months in barrel" : null].filter(Boolean).join(" · "),
                 agg: DB.ratings[r.key] };
      });
    } else {
      rows = Object.values(DB.bottleRatings).map(b => {
        const bl = DB.blends[b.blend];
        return { href: "#league/bottle/" + b.code, name: "Bottle " + b.code, sub: (bl ? vlabel(bl.vintage) + " · " : "") + "Blend " + blendLetter(b.blend) + " · " + b.barrel, agg: b };
      });
    }
    rows.sort((a, b) => score(b.agg) - score(a.agg) || b.agg.n - a.agg.n);
    if (!rows.length) c.appendChild(el("p", "muted", "No bottles rated yet."));
    const list = el("div", "list");
    rows.forEach((r, i) => {
      const a = el("a"); a.href = r.href;
      const left = el("div"); left.style.flex = "1";
      add(left, el("div", "name", r.name), r.sub ? el("div", "sub", r.sub) : null, ratingBar(r.agg));
      const right = el("div", "right"); right.appendChild(el("div", "score", Math.round(score(r.agg) * 100) + "%"));
      add(a, el("span", "rank", String(i + 1)), left, right);
      list.appendChild(a);
    });
    $main.appendChild(add(c, list));
  }

  // ----- printable labels -----
  let qrLoading = null;
  function loadQR() {
    if (window.qrcode) return Promise.resolve();
    return qrLoading || (qrLoading = new Promise((ok, bad) => { const s = document.createElement("script"); s.src = QR_LIB; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }));
  }
  function qrSvg(text) {
    const q = window.qrcode(0, "M"); q.addData(text); q.make();
    const tmp = document.createElement("div"); tmp.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    return tmp.firstChild;
  }
  async function labels(arg) {
    setVintage(null);
    document.title = "Labels · Green Lady";
    setTab(arg === "barrels" ? "barrels" : "bottles");
    $main.replaceChildren(add(card(), el("div", "empty", "Making labels…")));
    try { await loadQR(); } catch (e) { $main.replaceChildren(add(card(), el("div", "msg err", "Couldn't load the QR maker. Check the connection."))); return; }
    $main.replaceChildren();
    const ctl = card(arg === "barrels" ? "Barrel QR stickers" : "Bottle labels");
    ctl.classList.add("noprint");
    ctl.appendChild(el("p", "sub", "Sized for A4 sheets of 21 labels (63.5 × 38.1 mm, e.g. Avery L7160). Print at 100% / actual size."));
    const sheetWrap = el("div", "sheetwrap");
    let items = [];
    if (arg === "barrels") {
      items = DB.order.map(id => ({ url: SITE + "#" + id, big: id, t3: [DB.barrels[id].size, "Green Lady"].filter(Boolean).join(" · ") }));
    } else {
      const m = /^([^/]+)\/(\d+)(?:\/(\d+))?$/.exec(arg), p = m && parseCode(m[1]);
      if (!p) { barrelsTab("Label link not recognised."); return; }
      const r = DB.runs[p.run], start = 1;   // labels always numbered from 1, so every code passes the bottle check
      const count = Math.min(500, (r && r.bottles) || 500, parseInt(m[2], 10) || 24);
      const bl = DB.blends[p.blend];
      const f = el("form", "two"); f.style.marginTop = "0";
      const l1 = el("label"); l1.appendChild(document.createTextNode("How many")); const i1 = el("input"); i1.inputMode = "numeric"; i1.value = count; l1.appendChild(i1);
      add(f, l1);
      const upd = () => { location.hash = "labels/" + p.run + "/" + (parseInt(i1.value, 10) || 1); };
      i1.addEventListener("change", upd);
      f.addEventListener("submit", e => { e.preventDefault(); upd(); });
      ctl.appendChild(f);
      for (let n = start; n < start + count; n++) {
        const code = p.run + "-" + String(n).padStart(2, "0");
        items.push({ url: SITE + "#" + code, t1: vlabel(bl ? bl.vintage : null), t2: "Blend " + blendLetter(p.blend) + " · " + p.barrel + " · No. " + String(n).padStart(2, "0"), t3: "Scan me & rate me" });
      }
    }
    const pr = el("button", "primary full", "Print"); pr.type = "button"; pr.style.marginTop = "12px";
    // after printing (or Done), always go back to the Barrels list
    pr.addEventListener("click", () => {
      window.addEventListener("afterprint", () => { location.hash = "barrels"; }, { once: true });
      window.print();
    });
    const dn = el("a", "button soft full", "Done"); dn.href = "#barrels"; dn.style.marginTop = "10px";
    add(ctl, pr, dn);
    $main.appendChild(ctl);
    const sheet = el("div", "sheet");
    items.forEach(it => {
      const lab = el("div", "lab"), txt = el("div");
      lab.appendChild(qrSvg(it.url));
      if (it.big) add(txt, el("div", "big", it.big), el("div", "t3", it.t3));
      else add(txt, el("div", "t1", it.t1), el("div", "t2", it.t2), el("div", "t3", it.t3));
      lab.appendChild(txt);
      sheet.appendChild(lab);
    });
    $main.appendChild(add(sheetWrap, sheet));
  }

  // ----- League detail pages: blend / + barrel / + bottling, each with a Back button -----
  function leagueDetail(kind, code) {
    const p = kind === "blend" ? null : parseCode(code);
    const blendId = kind === "blend" ? code : p.blend;
    const bl = DB.blends[blendId], run = p ? DB.runs[p.run] : null, br = p ? DB.barrels[p.barrel] : null;
    setVintage(bl ? bl.vintage : null);
    setTab("league");
    $main.replaceChildren();
    window.scrollTo(0, 0);
    const back = el("a", "button soft small", "‹ Back");
    back.href = kind === "blend" ? "#league" : kind === "barrel" ? "#league/barrels" : "#league/bottles";
    back.style.marginBottom = "12px";
    $main.appendChild(back);

    // heading + this entry's rating
    let agg, title;
    if (kind === "blend") {
      agg = newAgg();
      Object.keys(DB.ratings).forEach(k => {
        const r = DB.runs[k], a = DB.ratings[k]; if (!r || r.blend !== blendId) return;
        addAgg(agg, a);
        Object.entries(a.tags).forEach(([x, v]) => agg.tags[x] = (agg.tags[x] || 0) + v);
      });
      title = (bl ? vlabel(bl.vintage) + " · " : "") + "Blend " + blendLetter(blendId);
    } else if (kind === "barrel") {
      agg = DB.ratings[p.run]; title = "Blend " + blendLetter(p.blend) + " · " + (br ? vesselName(br) : p.barrel);
    } else {
      agg = DB.bottleRatings[p.code]; title = "Bottle " + p.code;
    }
    document.title = title + " · Green Lady";
    const top = card(), head = el("div", "head");
    add(head, el("h1", null, title), agg && agg.n ? el("span", "score", Math.round(score(agg) * 100) + "%") : null);
    add(top, head, ratingBar(agg));
    const rv = kind === "bottle" ? reviewButton(p.code, "league") : null;
    if (rv) { rv.style.marginTop = "10px"; top.appendChild(rv); }
    $main.appendChild(top);

    // the blend
    const cb = card("The blend" + (bl ? " · " + blendId : "")), gb = el("div", "stats");
    gb.style.marginTop = "0";
    if (bl) { blendStats(gb, bl); if (bl.yeast && kind === "blend") stat(gb, "Yeast", bl.yeast, null, true); }   // barrel/bottle pages have The yeast box
    if (gb.children.length) cb.appendChild(gb); else cb.appendChild(el("p", "muted", "No details for this blend yet."));
    $main.appendChild(cb);
    add($main, applesCard(bl));
    if (kind === "blend") return;

    // the barrel: same as the barrel's own page (dates, yeast, notes) for this fill
    let fill = run && run.events ? run : null;
    if (!fill && br) fill = [br.current, ...br.history.slice().reverse()].find(f => f && f.blend === p.blend) || null;
    const cr = card("The barrel · " + p.barrel), gr = el("div", "stats");
    gr.style.marginTop = "0";
    if (br) { stat(gr, "Barrel", [br.size, br.type].filter(Boolean).join(" · ") || null, br.location || null, true); }
    if (fill && fill.filled) stat(gr, "Filled", fmtDate(fill.filled), ago(fill.filled), true);
    const bottledOn = run && run.bottled;
    if (fill && fill.filled) {
      const m = months(fill.filled, bottledOn || undefined);
      if (m != null) stat(gr, bottledOn ? "Time in barrel" : "In barrel so far", m < 1.5 ? Math.round(m * 30.44) + " days" : m.toFixed(1) + " months");
    }
    const lg = fill ? lastGravity(fill.events) : null;
    if (lg != null && !(run && run.fg != null)) {
      stat(gr, "Latest gravity", sg(lg));
      if (bl && bl.gravity != null && lg < bl.gravity) stat(gr, "ABV so far", abv(bl.gravity, lg).toFixed(1) + "%", "From gravity drop");
    }
    if (gr.children.length) cr.appendChild(gr); else cr.appendChild(el("p", "muted", "No barrel details."));
    $main.appendChild(cr);
    add($main, yeastCard(fill && fill.yeasts, (fill && fill.yeast) || (bl && bl.yeast)));
    const cn = card("Notes");
    cn.appendChild((fill && notesTable(fill.events)) || el("p", "muted", "No notes."));
    $main.appendChild(cn);

    // the bottling (bottle details only, not barrel details)
    if (kind === "barrel") return;   // no bottling box on barrel details
    const ct = card("The bottling"), gt = el("div", "stats");
    gt.style.marginTop = "0";
    if (run && run.bottled) stat(gt, "Bottled", fmtDate(run.bottled), ago(run.bottled), true);
    if (run && run.bottles) stat(gt, "Bottles", String(run.bottles));
    if (run && run.fg != null) stat(gt, "Final gravity", sg(run.fg));
    if (bl && bl.gravity != null && run && run.fg != null) stat(gt, "Strength", "≈ " + abv(bl.gravity, run.fg).toFixed(1) + "%", "ABV");
    if (run && run.priming) stat(gt, "Priming sugar", run.priming, null, true);
    if (gt.children.length) ct.appendChild(gt);
    if (run && run.note) ct.appendChild(el("p", "notes", run.note));
    if (!ct.querySelector(".stats, .notes")) ct.appendChild(el("p", "muted", "Not bottled yet."));
    $main.appendChild(ct);
  }

  // ---------- routing ----------
  function route() {
    window.scrollTo(0, 0);
    const raw = decodeURIComponent(location.hash.slice(1)).trim();
    const up = raw.toUpperCase();
    document.body.classList.toggle("slim", !(!raw || up === "BARRELS"));   // full header only on the Barrels list
    let m;
    if (!raw || up === "BARRELS") barrelsTab();
    else if (up === "BARRELS/NEW") barrelForm(null);
    else if ((m = /^([A-Z]\d{2,3})(\/.*)?$/.exec(up)) && DB.barrels[m[1]] && DB.barrels[m[1]].removed) barrelsTab(m[1] + " has been deleted.");
    else if (up === "BLENDS") blendsTab();
    else if (up === "BLENDS/NEW") blendForm(null);
    else if (up === "BOTTLES") bottlesTab();
    else if (up === "BOTTLES/REPRINT") bottlesTab("reprint");
    else if ((m = /^REVIEW\/([^/]+)(\/LEAGUE)?$/.exec(up)) && parseCode(m[1])) reviewPage(parseCode(m[1]).code, m[2] ? "league" : "");
    else if (up === "LEAGUE") league();
    else if (up === "LEAGUE/BARRELS") league("barrels");
    else if (up === "LEAGUE/BOTTLES") league("bottles");
    else if ((m = /^LEAGUE\/(BLEND|BARREL|BOTTLE)\/(.+)$/.exec(up)) && (m[1] === "BLEND" || parseCode(m[2]))) leagueDetail(m[1].toLowerCase(), m[1] === "BLEND" ? m[2] : parseCode(m[2]).code);
    else if (/^labels\//i.test(raw)) { FLASH = null; return labels(raw.slice(7)); }
    else if ((m = /^PRINT\/([^/]+)\/?(\d*)$/.exec(up)) && parseCode(m[1])) printPage(parseCode(m[1]).run, parseInt(m[2], 10) || 0);
    else if ((m = /^BLEND\/([^/]+)\/EDIT$/.exec(up)) && DB.blends[m[1]]) blendForm(DB.blends[m[1]]);
    else if ((m = /^BLEND\/([^/]+)$/.exec(up)) && DB.blends[m[1]]) blendPage(m[1]);
    else if ((m = /^([A-Z]\d{2,3})\/EDIT$/.exec(up)) && DB.barrels[m[1]]) barrelForm(DB.barrels[m[1]]);
    else if ((m = /^([A-Z]\d{2,3})\/FILL$/.exec(up)) && DB.barrels[m[1]]) fillForm(DB.barrels[m[1]]);
    else if ((m = /^([A-Z]\d{2,3})\/BOTTLE$/.exec(up)) && DB.barrels[m[1]]) { const bb = DB.barrels[m[1]]; if (bb.current) bottleForm(bb); else barrelPage(bb); }
    else if ((m = /^([A-Z]\d{2,3})\/EMPTY$/.exec(up)) && DB.barrels[m[1]]) { const bb = DB.barrels[m[1]]; if (bb.current) emptyForm(bb); else barrelPage(bb); }
    else if (DB.barrels[up]) barrelPage(DB.barrels[up]);
    else if (parseCode(up)) bottlePage(parseCode(up));
    else if (DB.blends[up]) blendPage(up);
    else barrelsTab("This tag (" + raw + ") isn't linked to a barrel or bottle yet.");
    if (FLASH) {
      const ok = el("div", "msg ok gap", FLASH.text);
      $main.insertBefore(ok, $main.firstChild);
      if (FLASH.link) { const a = el("a", "button primary full", FLASH.link.text); a.href = FLASH.link.href; a.style.marginBottom = "16px"; ok.after(a); }
      FLASH = null;
    }
  }

  window.addEventListener("hashchange", route);
  load().then(route).catch(() => {
    $main.replaceChildren(add(card(), el("div", "msg err", "Couldn't reach the cider records. Check your connection and refresh.")));
  });
})();
</script>
</body>
</html>
