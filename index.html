<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Green Lady Cider</title>
<link rel="icon" href="img/apple.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Green Lady cider - barrel and bottle pages.
  Data lives in the owner's Google Sheet, served by a Google Apps Script web app (see apps-script/Code.gs).
  Links:
    #B07            barrel page (NFC tag / QR on the barrel)
    #26A-B07-031    bottle page + rating (QR label on the bottle; the -031 bottle number is optional)
    #league         league table of bottling runs
    #labels/26A-B07/23   printable bottle QR labels     #labels/barrels   barrel QR stickers
  All Sheet text is shown with textContent only.
-->
<style>
:root {
  --bg: #f4efe2; --card: #fffdf7; --ink: #1d2a20; --muted: #5f6b5f; --line: #e2dccb;
  --green: #2f5d3a; --green-deep: #1c3a25; --apple: #7fae3a; --gold: #b8913c; --pill: #e6f0d6;
  --good: #3f8a3a; --ok: #c99a2e; --poor: #b5483a; --input: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a14; --card: #1b261e; --ink: #ecf0e6; --muted: #9fae9f; --line: #2c3a2f;
    --green: #8fc56a; --green-deep: #0e1d13; --apple: #9ccc55; --gold: #d8b25c; --pill: #26391f;
    --good: #6dbb5f; --ok: #e0b54a; --poor: #e07563; --input: #142017;
  }
}
:root[data-theme="dark"] {
  --bg: #121a14; --card: #1b261e; --ink: #ecf0e6; --muted: #9fae9f; --line: #2c3a2f;
  --green: #8fc56a; --green-deep: #0e1d13; --apple: #9ccc55; --gold: #d8b25c; --pill: #26391f;
  --good: #6dbb5f; --ok: #e0b54a; --poor: #e07563; --input: #142017;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; }
a { color: var(--green); }
header { background: var(--green-deep); color: #f4efe2; text-align: center; padding: 24px 16px 22px; border-bottom: 4px solid var(--gold); }
header a { color: inherit; text-decoration: none; }
header .kicker { font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: #cfdcc3; }
header .mark { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: clamp(38px, 11vw, 60px); line-height: 1; margin: 8px 0 4px; display: flex; align-items: center; justify-content: center; gap: 12px; }
header .mark svg { width: .8em; height: .8em; flex: none; }
header .vintage { font-family: Fraunces, Georgia, serif; font-size: 18px; color: var(--gold); letter-spacing: .1em; min-height: 1.4em; }
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.card h2 { font-family: Fraunces, Georgia, serif; font-size: 20px; margin: 0 0 12px; color: var(--green); font-weight: 600; }
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.head h1 { font-family: Fraunces, Georgia, serif; margin: 0; font-size: 28px; line-height: 1.15; }
.sub { color: var(--muted); font-size: 14px; }
.pill { background: var(--pill); color: var(--green); font-weight: 600; font-size: 13px; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
.pill.empty { background: var(--line); color: var(--muted); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .v { font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.stat .v.small { font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; padding-top: 4px; }
.stat .s { font-size: 13px; color: var(--muted); }
.apples { list-style: none; margin: 0; padding: 0; }
.apples li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.apples li:first-child { border-top: 0; padding-top: 0; }
.apples .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--apple); flex: none; }
.apples .name { font-weight: 600; }
.apples .share { margin-left: auto; font-weight: 600; color: var(--green); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 0 6px 6px 0; }
td { padding: 8px 6px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.notes { margin: 0; white-space: pre-line; }
.list a, .list .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
.list > :first-child { border-top: 0; padding-top: 0; }
.list .name { font-weight: 600; }
.list a:hover .name { color: var(--green); }
.list .right { text-align: right; flex: none; }
.muted, .empty { color: var(--muted); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button, .button { font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 12px; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
button.primary, .button.primary { background: var(--green); border-color: var(--green); color: var(--card); }
button:disabled { opacity: .5; cursor: default; }
.full { width: 100%; }
form { margin-top: 14px; display: grid; gap: 12px; }
label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
label small { font-weight: 400; color: var(--muted); }
input, select, textarea { font: inherit; font-weight: 400; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--input); color: var(--ink); width: 100%; }
textarea { min-height: 70px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.msg { padding: 10px 12px; border-radius: 8px; font-size: 14px; }
.msg.ok { background: var(--pill); color: var(--green); }
.msg.err { background: color-mix(in srgb, var(--poor) 15%, transparent); color: var(--poor); }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rate button { padding: 14px 6px; font-size: 15px; display: grid; gap: 4px; justify-items: center; }
.rate button .e { font-size: 30px; line-height: 1; }
.rate button.on { border-width: 2px; }
.rate button.on.Good { border-color: var(--good); color: var(--good); }
.rate button.on.OK { border-color: var(--ok); color: var(--ok); }
.rate button.on.Poor { border-color: var(--poor); color: var(--poor); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { padding: 6px 12px; font-size: 14px; font-weight: 500; border-radius: 999px; }
.chips button.on { background: var(--pill); border-color: var(--green); color: var(--green); }
.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 8px 0 4px; }
.bar span { display: block; }
.score { font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; }
.rank { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 20px; color: var(--gold); width: 28px; flex: none; }
.codebox { display: flex; gap: 8px; }
.codebox input { text-transform: uppercase; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 32px; }
footer a { color: inherit; }
/* Labels */
.sheet { background: #fff; color: #000; width: 210mm; padding: 15.1mm 7.2mm 0; display: grid; grid-template-columns: repeat(3, 63.5mm); grid-auto-rows: 38.1mm; column-gap: 2.5mm; margin: 0 auto; }
.lab { display: flex; align-items: center; gap: 2.5mm; padding: 2.5mm 3mm; overflow: hidden; font-family: Inter, sans-serif; border: 1px dashed #ddd; }
.lab svg { width: 30mm; height: 30mm; flex: none; }
.lab .t1 { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 12pt; line-height: 1.05; color: #1c3a25; }
.lab .t2 { font-size: 8pt; font-weight: 600; margin-top: 1mm; }
.lab .t3 { font-size: 7pt; color: #555; margin-top: 1mm; }
.lab .big { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 26pt; line-height: 1; color: #1c3a25; }
.sheetwrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; }
  header, footer, .noprint { display: none !important; }
  main { padding: 0; max-width: none; }
  .sheetwrap { margin: 0; padding: 0; overflow: visible; }
  .lab { border: 0; }
}
</style>
</head>
<body>
<header>
  <a href="#">
    <div class="kicker">Home made cider</div>
    <div class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#7fae3a" d="M12 7c-2-1.6-6-1.4-7.4 2-1.5 3.6.4 9.3 3.4 11.4 1.4 1 2.6.6 4 0 1.4.6 2.6 1 4 0 3-2.1 4.9-7.8 3.4-11.4C18 5.6 14 5.4 12 7Z"/><path fill="none" stroke="#b8913c" stroke-width="1.6" stroke-linecap="round" d="M12 7c0-2 .6-3.4 2-4.4"/><path fill="#cfe2a8" d="M12.6 5.6c1.2-1.8 3.4-2.4 5-1.8-.8 1.8-3 2.6-5 1.8Z"/></svg>
      <span>Green Lady</span>
    </div>
    <div class="vintage" id="vintage"></div>
  </a>
</header>

<main id="main" aria-live="polite">
  <section class="card"><div class="empty">Loading…</div></section>
</main>

<footer>Green Lady cider · made at home, drink responsibly · <a href="#">home</a> · <a href="#league">league table</a></footer>

<script>
(function () {
  const API = "https://script.google.com/macros/s/AKfycbyPnkwSR5pzMQDO_WFrjC0AkbpX5nvJRWnoWK29DAfRdYbD-7YWI2CCphQVP72EBGv5/exec";
  const SITE = "https://mrdanxxx.github.io/green-lady/";
  const QR_LIB = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
  const TAGS = ["Great", "Flat", "Too fizzy", "Sour", "Cloudy", "Too dry", "Too sweet", "Off smell"];
  const RATE = [["Good", "👍", "Loved it"], ["OK", "👌", "OK"], ["Poor", "👎", "Not for me"]];
  const $main = document.getElementById("main");
  let DB = null;

  // ---------- small helpers ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function add(parent, ...kids) { kids.forEach(k => k && parent.appendChild(k)); return parent; }
  function card(title) { const c = el("section", "card"); if (title) c.appendChild(el("h2", null, title)); return c; }
  const tidy = s => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  const day = s => { const m = /^(\d{4}-\d{2}-\d{2})/.exec(String(s || "")); return m ? m[1] : ""; };
  const numv = x => (x === "" || x == null || !isFinite(Number(x))) ? null : Number(x);
  function toDate(s) { const d = new Date(s + "T12:00:00"); return isNaN(d) ? null : d; }
  function fmtDate(s) { const d = toDate(s); return d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : (s || ""); }
  function daysBetween(a, b) { const x = toDate(a), y = b ? toDate(b) : new Date(); return x && y ? Math.floor((y - x) / 86400000) : null; }
  function ago(s) { const n = daysBetween(s); return n == null || n < 0 ? null : n === 0 ? "today" : n + (n === 1 ? " day ago" : " days ago"); }
  function months(a, b) { const n = daysBetween(a, b); return n == null || n < 0 ? null : (n / 30.44); }
  const sg = g => (typeof g === "number" ? g.toFixed(3) : "");
  const abv = (og, fg) => Math.max(0, (og - fg) * 131.25);
  const vlabel = v => v != null ? "Green Lady " + v : "Green Lady";
  function stat(grid, k, v, s, small) {
    if (v == null || v === "") return;
    const b = el("div", "stat");
    add(b, el("div", "k", k), el("div", "v" + (small ? " small" : ""), v), s ? el("div", "s", s) : null);
    grid.appendChild(b);
  }
  function setVintage(v) { document.getElementById("vintage").textContent = v != null ? "VINTAGE " + v : ""; }
  function blendLetter(id) { const m = /^\d+(.*)$/.exec(id); return m && m[1] ? m[1] : id; }
  function vesselName(b) { return (/^D/.test(b.id) || /glass/i.test(b.type) ? "Demijohn " : "Barrel ") + b.id; }

  function parseApples(s) {
    return String(s || "").split(/;|\n/).map(tidy).filter(Boolean).map(part => {
      const i = part.indexOf(" - ");
      let left = i >= 0 ? part.slice(0, i) : part, loc = i >= 0 ? part.slice(i + 3).trim() : "";
      const m = /^(.*?)\s*(\d+(?:\.\d+)?\s*%)\s*$/.exec(left);
      return { variety: m ? m[1] : left, share: m ? m[2].replace(/\s+/g, "") : "", location: loc };
    });
  }
  function parseCode(s) {
    const t = String(s || "").toUpperCase().replace(/\s+/g, "");
    const m = /^(\d+[A-Z]+?)-?([BD]\d{2,3})(?:-?(\d{1,4}))?$/.exec(t);
    if (!m) return null;
    const n = m[3] ? m[3].padStart(3, "0") : "";
    return { blend: m[1], barrel: m[2], n, run: m[1] + "-" + m[2], code: m[1] + "-" + m[2] + (n ? "-" + n : "") };
  }

  // ---------- data ----------
  function build(raw) {
    const blends = {}, barrels = {}, order = [], runs = {}, ratings = {};
    (raw.Blends || []).forEach(r => {
      if (!r.Blend) return;
      const id = tidy(r.Blend).toUpperCase();
      let v = numv(r.Vintage);
      if (v == null) { const m = /^(\d+)/.exec(id); v = m ? Number(m[1]) : null; }
      if (v != null && v >= 100) v = v % 100;
      blends[id] = { id, vintage: v, juiced: day(r.Juiced), apples: parseApples(r.Apples), gravity: numv(r.Gravity), ph: numv(r.pH), yeast: tidy(r.Yeast), notes: String(r.Notes || "").trim() };
    });
    (raw.Barrels || []).forEach(r => {
      if (!r.Barrel) return;
      const id = tidy(r.Barrel).toUpperCase();
      const sk = Object.keys(r).find(k => /^size/i.test(k));
      let size = sk ? r[sk] : "";
      if (size !== "" && /^\d+(\.\d+)?$/.test(String(size))) size = size + " L";
      barrels[id] = { id, size: tidy(size), type: tidy(r.Type), location: tidy(r.Location), notes: tidy(r.Notes), current: null, history: [] };
      order.push(id);
    });
    (raw.Log || []).forEach(e => {
      const id = tidy(e.Barrel).toUpperCase(), b = barrels[id];
      if (!b) return;
      const ev = { date: day(e.Time), action: tidy(e.Action), blend: tidy(e.Blend).toUpperCase(), gravity: numv(e.Gravity), ph: numv(e.pH),
                   bottles: numv(e.Bottles), priming: tidy(e.Priming), location: tidy(e.Location), note: String(e.Note || "").trim(), by: tidy(e.By) };
      switch (ev.action) {
        case "Fill":
          if (b.current) b.history.push(b.current);
          b.current = { blend: ev.blend, filled: ev.date, events: [], by: ev.by };
          break;
        case "Moved":
          if (ev.location) b.location = ev.location;
          if (b.current) b.current.events.push(ev);
          break;
        case "Reading": case "Note":
          if (b.current) b.current.events.push(ev);
          break;
        case "Bottled": {
          const fill = b.current || { blend: ev.blend, filled: "", events: [] };
          const blend = ev.blend || fill.blend;
          const fg = ev.gravity != null ? ev.gravity : lastGravity(fill.events);
          fill.bottled = ev;
          runs[blend + "-" + id] = { key: blend + "-" + id, blend, barrel: id, filled: fill.filled, bottled: ev.date, bottles: ev.bottles,
                                     priming: ev.priming, fg, by: ev.by, note: ev.note, events: fill.events };
          b.history.push(fill);
          b.current = null;
          break;
        }
        case "Empty":
          if (b.current) { b.current.emptied = ev; b.history.push(b.current); }
          b.current = null;
          break;
      }
    });
    (raw.Ratings || []).forEach(r => {
      const p = parseCode(r.Bottle);
      if (!p || !["Good", "OK", "Poor"].includes(r.Rating)) return;
      const k = p.run;
      const a = ratings[k] || (ratings[k] = { Good: 0, OK: 0, Poor: 0, n: 0, tags: {} });
      a[r.Rating]++; a.n++;
      String(r.Tags || "").split(",").map(tidy).filter(Boolean).forEach(t => a.tags[t] = (a.tags[t] || 0) + 1);
      if (!runs[k]) runs[k] = { key: k, blend: p.blend, barrel: p.barrel };
    });
    return { blends, barrels, order, runs, ratings };
  }
  function lastGravity(events) {
    const g = (events || []).filter(e => e.gravity != null);
    return g.length ? g[g.length - 1].gravity : null;
  }
  async function load() {
    const r = await fetch(API, { cache: "no-store" });
    DB = build(await r.json());
  }
  async function post(body) {
    const r = await fetch(API, { method: "POST", body: JSON.stringify(body) });
    return r.json();
  }
  const score = a => a && a.n ? (a.Good + a.OK * 0.5) / a.n : null;

  // ---------- shared blocks ----------
  function applesCard(blend) {
    if (!blend || !blend.apples.length) return null;
    const c = card("The apples"), ul = el("ul", "apples");
    blend.apples.forEach(a => {
      const li = el("li"), t = el("div");
      add(t, el("div", "name", a.variety), a.location ? el("div", "sub", a.location) : null);
      add(li, el("span", "dot"), t, a.share ? el("span", "share", a.share) : null);
      ul.appendChild(li);
    });
    return add(c, ul);
  }
  function readingsCard(events, title) {
    const rows = (events || []).filter(e => e.gravity != null || e.ph != null || e.note || e.action === "Moved");
    if (!rows.length) return null;
    const c = card(title || "Readings"), t = el("table"), hr = el("tr");
    ["Date", "Gravity", "pH", "Notes"].forEach(x => hr.appendChild(el("th", null, x)));
    t.appendChild(hr);
    rows.forEach(r => {
      const tr = el("tr");
      const note = r.action === "Moved" ? "Moved to " + r.location + (r.note ? " – " + r.note : "") : r.note;
      add(tr, el("td", "num", fmtDate(r.date)), el("td", "num", r.gravity != null ? sg(r.gravity) : "–"),
          el("td", "num", r.ph != null ? String(r.ph) : "–"), el("td", null, [note, r.by ? "(" + r.by + ")" : ""].filter(Boolean).join(" ")));
      t.appendChild(tr);
    });
    return add(c, t);
  }
  function ratingBar(a) {
    const wrap = el("div");
    if (!a || !a.n) { wrap.appendChild(el("div", "muted", "No ratings yet.")); return wrap; }
    const bar = el("div", "bar");
    [["Good", "--good"], ["OK", "--ok"], ["Poor", "--poor"]].forEach(([k, c]) => {
      if (!a[k]) return;
      const s = el("span"); s.style.width = (a[k] / a.n * 100) + "%"; s.style.background = "var(" + c + ")"; bar.appendChild(s);
    });
    wrap.appendChild(bar);
    wrap.appendChild(el("div", "sub", a.n + (a.n === 1 ? " rating: " : " ratings: ") + "👍 " + a.Good + " · 👌 " + a.OK + " · 👎 " + a.Poor));
    const tags = Object.entries(a.tags).sort((x, y) => y[1] - x[1]).slice(0, 4);
    if (tags.length) wrap.appendChild(el("div", "sub", "Most said: " + tags.map(([t, n]) => t + " (" + n + ")").join(", ")));
    return wrap;
  }

  // ---------- pages ----------
  function home(message) {
    setVintage(null);
    document.title = "Green Lady Cider";
    $main.replaceChildren();

    const c1 = card("Got a bottle?");
    c1.appendChild(el("p", "sub", "Scan the label, or type the code from the cap or label (e.g. 26A-B07)."));
    const f = el("form", "codebox"), inp = el("input");
    inp.placeholder = "26A-B07"; inp.autocomplete = "off"; inp.setAttribute("aria-label", "Bottle code");
    const go = el("button", "primary", "Go");
    f.style.marginTop = "0";
    add(f, inp, go);
    const fmsg = el("div", "msg err"); fmsg.hidden = true;
    f.addEventListener("submit", ev => {
      ev.preventDefault();
      const v = inp.value.trim().toUpperCase();
      const p = parseCode(v);
      if (p) location.hash = p.code;
      else if (DB.barrels[v]) location.hash = v;
      else { fmsg.textContent = "That code isn't recognised. It looks like 26A-B07."; fmsg.hidden = false; }
    });
    add(c1, f, fmsg);
    $main.appendChild(c1);

    if (message) { const m = el("div", "msg err", message); m.style.marginBottom = "16px"; $main.insertBefore(m, c1); }

    // barrels grouped by location

    stat(grid, "Starting gravity", blend.gravity != null ? sg(blend.gravity) : null,
         blend.gravity != null ? "Potential " + abv(blend.gravity, 1.0).toFixed(1) + "% ABV" : null);
    stat(grid, "Starting pH", blend.ph != null ? String(blend.ph) : null);
  }

  // ----- crew input -----
  const FIELDS = {
    Fill:    [["blend", "Which blend?", "blend"], ["note", "Note", "text"]],
    Reading: [["gravity", "Gravity", "gravity"], ["ph", "pH", "ph"], ["note", "Note", "text"]],
    Bottled: [["bottles", "How many bottles?", "int"], ["gravity", "Final gravity", "gravity"], ["priming", "Priming sugar", "short", "e.g. 6 g per litre, or none"], ["note", "Note", "text"]],
    Moved:   [["location", "Moved to", "location"], ["note", "Note", "text"]],
    Note:    [["note", "Note", "text"]],
    Empty:   [["note", "Why? (racked, spoiled…)", "text"]],
  };
  const LABEL = { Fill: "Fill this barrel", Reading: "+ Reading", Bottled: "Bottled", Moved: "Moved", Note: "+ Note", Empty: "Emptied" };

  function crewCard(b) {
    const c = card("Crew");
    c.appendChild(el("p", "sub", "Record what's happened to this " + (/^D/.test(b.id) ? "demijohn" : "barrel") + ". Needs the crew PIN."));
    const btns = el("div", "btns"), slot = el("div");
    const actions = b.current ? ["Reading", "Bottled", "Note", "Moved", "Empty"] : ["Fill", "Moved"];
    actions.forEach((a, i) => {
      const bt = el("button", i === 0 ? "primary" : null, LABEL[a]);
      bt.type = "button";

  function crewForm(b, action) {
    const f = el("form"), inputs = {};
    f.appendChild(el("h3", null, LABEL[action] + " · " + b.id));
    FIELDS[action].forEach(([k, label, kind, hint]) => {
      const l = el("label");
      l.appendChild(document.createTextNode(label));
      let inp;
      if (kind === "blend") {
        inp = el("select");
        Object.keys(DB.blends).sort().reverse().forEach(id => {
          const o = el("option", null, id + " · " + DB.blends[id].apples.map(x => x.variety).join(", "));
          o.value = id; inp.appendChild(o);
        });
        if (!inp.options.length) { const o = el("option", null, "No blends in the Sheet yet"); o.value = ""; inp.appendChild(o); }
      } else if (kind === "text") {
        inp = el("textarea");
      } else {
        inp = el("input");
        if (kind === "gravity") { inp.inputMode = "decimal"; inp.placeholder = "1.010"; }
        if (kind === "ph") { inp.inputMode = "decimal"; inp.placeholder = "3.5"; }
        if (kind === "int") { inp.inputMode = "numeric"; inp.placeholder = "23"; }
        if (kind === "short" && hint) inp.placeholder = hint;
        if (kind === "location") {
          const dl = el("datalist"); dl.id = "locs";
          [...new Set(DB.order.map(id => DB.barrels[id].location).filter(Boolean))].forEach(x => { const o = el("option"); o.value = x; dl.appendChild(o); });
          l.appendChild(dl); inp.setAttribute("list", "locs");
        }
      }
      inputs[k] = inp;
      l.appendChild(inp);
      f.appendChild(l);
    });
    const two = el("div", "two");
    const ln = el("label"); ln.appendChild(document.createTextNode("Your name"));
    const by = el("input"); by.value = store.get("gl-name") || ""; by.autocomplete = "given-name"; ln.appendChild(by);
    const lp = el("label"); lp.appendChild(document.createTextNode("Crew PIN"));
    const pin = el("input"); pin.type = "password"; pin.inputMode = "numeric"; pin.value = store.get("gl-pin") || ""; lp.appendChild(pin);
    add(f, add(two, ln, lp));
    const msg = el("div", "msg"); msg.hidden = true;
    const save = el("button", "primary full", "Save");
    add(f, save, msg);

    f.addEventListener("submit", async ev => {
      ev.preventDefault();
      const body = { kind: "log", action, barrel: b.id, pin: pin.value.trim(), by: by.value.trim() };
      Object.keys(inputs).forEach(k => body[k] = inputs[k].value.trim());
      if (action === "Fill" && !body.blend) return show("Add the blend to the Blends tab first.");
      if (action === "Bottled") body.blend = b.current ? b.current.blend : "";
      for (const k of ["gravity", "ph", "bottles"]) {
        if (body[k] && !isFinite(Number(body[k].replace(",", ".")))) return show("That " + (k === "ph" ? "pH" : k) + " doesn't look like a number.");
        if (body[k]) body[k] = body[k].replace(",", ".");
      }
      if (action === "Reading" && !body.gravity && !body.ph && !body.note) return show("Enter a gravity, pH or note.");
      if (action === "Moved" && !body.location) return show("Where has it gone?");
      if (!body.pin) return show("Enter the crew PIN.");
      save.disabled = true; save.textContent = "Saving…";
      try {
        const r = await post(body);
        if (!r.ok) {
          if (/pin/i.test(r.error || "")) store.del("gl-pin");
          save.disabled = false; save.textContent = "Save";
          return show(r.error || "Couldn't save.");
        }
        store.set("gl-pin", body.pin);
        if (body.by) store.set("gl-name", body.by);
        await load();
        barrelPage(DB.barrels[b.id]);
        const done = el("div", "msg ok", "Saved: " + LABEL[action].replace("+ ", "") + " for " + b.id + ".");
        $main.insertBefore(done, $main.firstChild);
        if (action === "Bottled") {
          const run = body.blend + "-" + b.id;
          const a = el("a", "button primary full", "Print " + (body.bottles || "") + " bottle labels");
          a.href = "#labels/" + run + "/" + (parseInt(body.bottles, 10) || 24);
          a.style.margin = "-6px 0 16px";
          $main.insertBefore(a, done.nextSibling);
        }
      } catch (e) {
        save.disabled = false; save.textContent = "Save";
        show("No connection – nothing was saved. Try again.");
      }
    });
    function show(t) { msg.className = "msg err"; msg.textContent = t; msg.hidden = false; }
    return f;
  }

  function rateCard(p) {
    const c = card("How was it?");
    const key = "gl-rated-" + p.code;
    const prev = store.get(key);
    const agg = DB.ratings[p.run];
    if (prev) {
      c.appendChild(el("p", null, "Thanks – you rated this bottle " + (RATE.find(r => r[0] === prev) || ["", "", prev])[1] + " " + prev + "."));
      c.appendChild(el("h3", null, "What everyone thought of this batch"));
      c.appendChild(ratingBar(agg));
      const again = el("button", null, "Change my rating"); again.type = "button"; again.style.marginTop = "12px";
      again.addEventListener("click", () => { store.del(key); c.replaceWith(rateCard(p)); });
      c.appendChild(again);
      return c;
    }
    let choice = null;
    const tags = new Set();
    const row = el("div", "rate");
    RATE.forEach(([k, e, label]) => {
      const bt = el("button", k); bt.type = "button";
      add(bt, el("span", "e", e), el("span", null, label));
      bt.addEventListener("click", () => {
        choice = k;
        row.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === bt));
        extra.hidden = false; send.disabled = false;
      });
      row.appendChild(bt);
    });
    c.appendChild(row);
    const extra = el("div"); extra.hidden = true;
    extra.appendChild(el("h3", null, "Anything stand out? (optional)"));
    const chips = el("div", "chips");
    TAGS.forEach(t => {
      const ch = el("button", null, t); ch.type = "button";
      ch.addEventListener("click", () => { tags.has(t) ? tags.delete(t) : tags.add(t); ch.classList.toggle("on"); });
      chips.appendChild(ch);
    });
    extra.appendChild(chips);
    const f = el("form");
    const ln = el("label"); ln.appendChild(document.createTextNode("Your first name ")); ln.lastChild.after(el("small", null, "optional"));
    const name = el("input"); name.value = store.get("gl-name") || ""; ln.appendChild(name);
    const lc = el("label"); lc.appendChild(document.createTextNode("Comment ")); lc.lastChild.after(el("small", null, "optional, only the cider maker sees it"));
    const comment = el("textarea"); lc.appendChild(comment);
    const send = el("button", "primary full", "Send rating"); send.disabled = true;
    const msg = el("div", "msg err"); msg.hidden = true;
    add(f, ln, lc, send, msg);
    extra.appendChild(f);
    c.appendChild(extra);
    if (agg && agg.n) { c.appendChild(el("h3", null, "So far")); c.appendChild(ratingBar(agg)); }

    f.addEventListener("submit", async ev => {
      ev.preventDefault();
      if (!choice) return;
      send.disabled = true; send.textContent = "Sending…";
      try {
        const r = await post({ kind: "rating", bottle: p.code, rating: choice, tags: [...tags].join(", "), name: name.value.trim(), comment: comment.value.trim() });
        if (!r.ok) throw new Error(r.error);
        store.set(key, choice);
        if (name.value.trim()) store.set("gl-name", name.value.trim());
        await load();
        c.replaceWith(rateCard(p));
      } catch (e) {
        send.disabled = false; send.textContent = "Send rating";
        msg.textContent = "Couldn't send – check your connection and try again."; msg.hidden = false;
      }
    });
    return c;
  }

  // ----- printable labels -----
  let qrLoading = null;
  function loadQR() {
    if (window.qrcode) return Promise.resolve();
    return qrLoading || (qrLoading = new Promise((ok, bad) => { const s = document.createElement("script"); s.src = QR_LIB; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }));
  }
  function qrSvg(text) {
    const q = window.qrcode(0, "M"); q.addData(text); q.make();
    const tmp = document.createElement("div"); tmp.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    return tmp.firstChild;
  }
  async function labels(arg) {
    setVintage(null);
    document.title = "Labels · Green Lady";
    $main.replaceChildren(add(card(), el("div", "empty", "Making labels…")));
    try { await loadQR(); } catch (e) { $main.replaceChildren(add(card(), el("div", "msg err", "Couldn't load the QR maker. Check the connection."))); return; }
    $main.replaceChildren();
    const ctl = card(arg === "barrels" ? "Barrel QR stickers" : "Bottle labels");
    ctl.classList.add("noprint");
    ctl.appendChild(el("p", "sub", "Sized for A4 sheets of 21 labels (63.5 × 38.1 mm, e.g. Avery L7160). Print at 100% / actual size."));
    const sheetWrap = el("div", "sheetwrap");
    let items = [];
    if (arg === "barrels") {
      items = DB.order.map(id => ({ url: SITE + "#" + id, big: id, t3: [DB.barrels[id].size, "Green Lady"].filter(Boolean).join(" · ") }));
    } else {
      const m = /^([^/]+)\/(\d+)(?:\/(\d+))?$/.exec(arg), p = m && parseCode(m[1]);
      if (!p) { home("Label link not recognised."); return; }
      const count = Math.min(500, parseInt(m[2], 10) || 24), start = parseInt(m[3] || "1", 10) || 1;
      const bl = DB.blends[p.blend];
      const f = el("form", "two"); f.style.marginTop = "0";
      const l1 = el("label"); l1.appendChild(document.createTextNode("How many")); const i1 = el("input"); i1.inputMode = "numeric"; i1.value = count; l1.appendChild(i1);
      const l2 = el("label"); l2.appendChild(document.createTextNode("First number")); const i2 = el("input"); i2.inputMode = "numeric"; i2.value = start; l2.appendChild(i2);
      add(f, l1, l2);
      const upd = () => { location.hash = "labels/" + p.run + "/" + (parseInt(i1.value, 10) || 1) + "/" + (parseInt(i2.value, 10) || 1); };
      i1.addEventListener("change", upd); i2.addEventListener("change", upd);
      f.addEventListener("submit", e => { e.preventDefault(); upd(); });
      ctl.appendChild(f);
      for (let n = start; n < start + count; n++) {
        const code = p.run + "-" + String(n).padStart(3, "0");
        items.push({ url: SITE + "#" + code, t1: vlabel(bl ? bl.vintage : null), t2: "Blend " + blendLetter(p.blend) + " · " + p.barrel + " · No. " + String(n).padStart(3, "0"), t3: "Scan me & rate me" });
      }
    }
    const pr = el("button", "primary full", "Print"); pr.type = "button"; pr.style.marginTop = "12px";
    pr.addEventListener("click", () => window.print());
    ctl.appendChild(pr);
    $main.appendChild(ctl);
    const sheet = el("div", "sheet");
    items.forEach(it => {
      const lab = el("div", "lab"), txt = el("div");
      lab.appendChild(qrSvg(it.url));
      if (it.big) add(txt, el("div", "big", it.big), el("div", "t3", it.t3));
      else add(txt, el("div", "t1", it.t1), el("div", "t2", it.t2), el("div", "t3", it.t3));
      lab.appendChild(txt);
      sheet.appendChild(lab);
    });
    $main.appendChild(add(sheetWrap, sheet));
  }

  // ---------- routing ----------
  function route() {
    const raw = decodeURIComponent(location.hash.slice(1)).trim();
    const up = raw.toUpperCase();
    if (!raw) return home();
    if (up === "LEAGUE") return league();
    if (/^labels\//i.test(raw)) return labels(raw.slice(7));
    if (/^blend\//i.test(raw)) { const id = up.slice(6); if (DB.blends[id]) return blendPage(id); }
    if (DB.barrels[up]) return barrelPage(DB.barrels[up]);
    const p = parseCode(up);
    if (p) return bottlePage(p);
    if (DB.blends[up]) return blendPage(up);
    home("This tag (" + raw + ") isn't linked to a barrel or bottle yet.");
  }

  window.addEventListener("hashchange", route);
  load().then(route).catch(() => {
    $main.replaceChildren(add(card(), el("div", "msg err", "Couldn't reach the cider records. Check your connection and refresh.")));
  });
})();
</script>
</body>
</html>
